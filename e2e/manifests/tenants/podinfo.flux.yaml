  chart:
    spec:
      chart: podinfo
      version: "6.17.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
      interval: 24h
  values:
    serviceMonitor:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-green
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 15m
  targetNamespace: green
  storageNamespace: green
  releaseName: podinfo
  dependsOn:
