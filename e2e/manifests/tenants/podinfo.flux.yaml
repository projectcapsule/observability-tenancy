---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 24h0m0s
  type: oci
  url: oci://ghcr.io/stefanprodan/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-solar
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 15m
  targetNamespace: solar
  storageNamespace: solar
  releaseName: podinfo
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: podinfo
      version: "6.17.0"
      sourceRef:
        kind: HelmRepository
        name: podinfo
      interval: 24h
  values:
    serviceMonitor:
      enabled: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
