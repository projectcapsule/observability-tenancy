---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 24h0m0s
  type: oci
  url: oci://ghcr.io/grafana-community/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 15m
  timeout: 10m
  targetNamespace: monitoring-system
  releaseName: "loki"
  dependsOn:
    - name: kube-prometheus-stack
  chart:
    spec:
      chart: loki
      version: "21.4.3"
      sourceRef:
        kind: HelmRepository
        name: loki
      interval: 24h
  install:
    createNamespace: false
  upgrade:
    remediation:
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    global:
      clusterDomain: "cluster.local"
      dnsService: "kube-dns"
      dnsNamespace: "kube-system"
    # Monolithic (chart default) with local filesystem storage: no object storage needed for e2e
    singleBinary:
      replicas: 1
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        annotations:
          k8s-sidecar-target-directory: "/tmp/dashboards/Monitoring Stack"
    loki:
      auth_enabled: true
      commonConfig:
        replication_factor: 1
      querier:
        multi_tenant_queries_enabled: true
      # https://grafana.com/docs/loki/latest/operations/storage/retention/
      compactor:
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem
      limits_config:
        per_stream_rate_limit: 1024M
        per_stream_rate_limit_burst: 2048M
        cardinality_limit: 20000
        ingestion_burst_size_mb: 1000
        ingestion_rate_mb: 2000
        retention_period: 24h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true
      schemaConfig:
        configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
      storage:
        type: filesystem
